name: process-media

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the plan without downloading"
        type: boolean
        default: false

concurrency:
  group: process-media
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ffmpeg must be installed BEFORE the tests: the has_audio guard shells
      # out to ffprobe, and its tests generate real fixtures with ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify tools
        run: |
          ffmpeg -version | head -1
          yt-dlp --version

      - name: Run tests
        run: python -m pytest -q

      - name: Process media
        env:
          # User OAuth: a service account has no Drive storage quota, so it can
          # never own an uploaded file. These three make the worker act as the
          # operator's account instead.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m worker.main --dry-run
          else
            python -m worker.main
          fi
