name: debug-formats

# TEMPORARY diagnostic. Prints the formats yt-dlp sees for one video and
# simulates candidate format selectors, so the real selector is chosen from
# evidence rather than guesswork. Deleted once the fix lands.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Vimeo player URL to inspect"
        required: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r /dev/null || true
          pip install "yt-dlp==2025.9.26"
          yt-dlp --version

      - name: List available formats
        run: |
          echo "::group::FORMATS"
          yt-dlp --no-warnings --no-playlist -F "${{ inputs.url }}" || true
          echo "::endgroup::"

      - name: Show the raw info's format table
        run: |
          echo "::group::JSON"
          yt-dlp --no-warnings --no-playlist -J "${{ inputs.url }}" \
            | python -c "import json,sys; d=json.load(sys.stdin); [print(f['format_id'], f.get('ext'), f.get('vcodec'), f.get('acodec'), f.get('protocol')) for f in d.get('formats',[])]" \
            || true
          echo "::endgroup::"

      - name: Download with the shipped selector
        run: |
          set -x
          yt-dlp --no-warnings --no-playlist --force-ipv4 \
            -f 'bv*[vcodec^=avc1]+ba[acodec^=mp4a]/bv*+ba/b' \
            --merge-output-format mp4 \
            -o 'out.%(ext)s' "${{ inputs.url }}"
          ls -la out.*

      - name: Verify BOTH streams are present
        run: |
          echo "::group::STREAMS"
          ffprobe -v error -show_entries stream=codec_type,codec_name \
            -of csv=p=0 out.mp4
          echo "::endgroup::"
          kinds=$(ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out.mp4 | sort -u | tr '\n' ' ')
          echo "kinds: $kinds"
          case "$kinds" in
            *video*audio*) echo "RESULT: BOTH STREAMS PRESENT" ;;
            *) echo "RESULT: MISSING A STREAM -> $kinds"; exit 1 ;;
          esac

      - name: Report size and duration
        run: |
          ls -l out.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out.mp4
